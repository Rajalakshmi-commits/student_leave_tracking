<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Student Leave Tracking System
    </title>


    <!-- ================================= -->
    <!-- EXCEL LIBRARY -->
    <!-- ================================= -->

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>


    <!-- ================================= -->
    <!-- CSS -->
    <!-- ================================= -->

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }


        /* ================================= */
        /* NEW ANIMATED BACKGROUND */
        /* ================================= */

        body {

            min-height: 100vh;

            background: linear-gradient(
                -45deg,
                #1a237e,
                #6a1b9a,
                #ad1457,
                #283593,
                #4527a0
            );

            background-size: 400% 400%;

            animation:
                newBackground 12s ease infinite;

            padding: 20px;
        }


        @keyframes newBackground {

            0% {
                background-position: 0% 50%;
            }

            25% {
                background-position: 50% 100%;
            }

            50% {
                background-position: 100% 50%;
            }

            75% {
                background-position: 50% 0%;
            }

            100% {
                background-position: 0% 50%;
            }

        }


        /* ================================= */
        /* CONTAINER */
        /* ================================= */

        .container {

            width: 550px;

            max-width: 95%;

            margin: 40px auto;

            background: white;

            padding: 25px;

            border-radius: 15px;

            box-shadow:
                0 10px 30px
                rgba(0, 0, 0, 0.4);

            animation:
                fadeIn 1s ease;
        }


        @keyframes fadeIn {

            from {

                opacity: 0;

                transform:
                    translateY(40px);

            }

            to {

                opacity: 1;

                transform:
                    translateY(0);

            }

        }


        /* ================================= */
        /* HEADINGS */
        /* ================================= */

        h1 {

            text-align: center;

            color: #283593;

            margin-bottom: 10px;

            font-size: 28px;
        }


        .subtitle {

            text-align: center;

            color: #666;

            margin-bottom: 25px;
        }


        /* ================================= */
        /* LOGIN PAGE */
        /* ================================= */

        #loginSection {

            width: 500px;

            max-width: 95%;

            margin: 100px auto;
        }


        .login-icon {

            text-align: center;

            font-size: 55px;

            margin-bottom: 10px;
        }


        .login-title {

            text-align: center;

            color: #283593;

            margin-bottom: 10px;

            font-size: 28px;
        }


        .login-text {

            text-align: center;

            color: #666;

            margin-bottom: 25px;
        }


        /* ================================= */
        /* LABELS */
        /* ================================= */

        label {

            display: block;

            margin-top: 15px;

            margin-bottom: 5px;

            font-weight: bold;

            color: #333;
        }


        /* ================================= */
        /* INPUTS */
        /* ================================= */

        input,
        select,
        textarea {

            width: 100%;

            padding: 12px;

            border: 1px solid #ccc;

            border-radius: 8px;

            font-size: 15px;

            outline: none;
        }


        input:focus,
        select:focus,
        textarea:focus {

            border-color: #6a1b9a;

            box-shadow:
                0 0 5px
                rgba(106, 27, 154, 0.3);
        }


        textarea {

            resize: vertical;

            min-height: 80px;
        }


        /* ================================= */
        /* BUTTON */
        /* ================================= */

        button {

            width: 100%;

            padding: 13px;

            margin-top: 20px;

            border: none;

            border-radius: 8px;

            background: #283593;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }


        button:hover {

            background: #6a1b9a;

            transform: scale(1.02);
        }


        /* ================================= */
        /* LOGIN BUTTON */
        /* ================================= */

        .login-btn {

            background: linear-gradient(
                135deg,
                #283593,
                #6a1b9a
            );
        }


        /* ================================= */
        /* LOGGED EMAIL */
        /* ================================= */

        .logged-email {

            background: #ede7f6;

            color: #4527a0;

            padding: 11px;

            border-radius: 8px;

            text-align: center;

            font-weight: bold;

            margin-bottom: 20px;
        }


        /* ================================= */
        /* MESSAGE */
        /* ================================= */

        .message {

            margin-top: 15px;

            padding: 10px;

            text-align: center;

            border-radius: 6px;

            display: none;
        }


        .success {

            background: #d4edda;

            color: #155724;
        }


        .error {

            background: #f8d7da;

            color: #721c24;
        }


        /* ================================= */
        /* HISTORY */
        /* ================================= */

        .history {

            margin-top: 30px;
        }


        .history h2 {

            color: #283593;

            margin-bottom: 15px;
        }


        /* ================================= */
        /* TABLE */
        /* ================================= */

        .table-container {

            overflow-x: auto;
        }


        table {

            width: 100%;

            border-collapse: collapse;

            min-width: 750px;
        }


        th,
        td {

            border: 1px solid #ddd;

            padding: 10px;

            text-align: center;

            font-size: 13px;
        }


        th {

            background: #283593;

            color: white;
        }


        /* ================================= */
        /* STATUS */
        /* ================================= */

        .status {

            padding: 5px 8px;

            border-radius: 5px;

            color: white;

            font-size: 12px;
        }


        .pending {

            background: #ff9800;
        }


        .approved {

            background: #28a745;
        }


        .rejected {

            background: #dc3545;
        }


        /* ================================= */
        /* BUTTON GROUP */
        /* ================================= */

        .button-group {

            display: flex;

            gap: 10px;
        }


        .button-group button {

            flex: 1;

            margin-top: 15px;
        }


        /* ================================= */
        /* EXCEL BUTTON */
        /* ================================= */

        .excel-btn {

            background: #198754;
        }


        .excel-btn:hover {

            background: #146c43;
        }


        /* ================================= */
        /* CLEAR BUTTON */
        /* ================================= */

        .clear-btn {

            background: #dc3545;
        }


        .clear-btn:hover {

            background: #b71c1c;
        }


        /* ================================= */
        /* LOGOUT BUTTON */
        /* ================================= */

        .logout-btn {

            background: #6c757d;
        }


        .logout-btn:hover {

            background: #495057;
        }


        /* ================================= */
        /* MOBILE */
        /* ================================= */

        @media (max-width: 600px) {

            .container {

                margin: 20px auto;

                padding: 18px;
            }


            .button-group {

                flex-direction: column;
            }


            table {

                font-size: 11px;
            }


            th,
            td {

                padding: 6px;
            }

        }

    </style>

</head>


<body>


    <!-- ================================= -->
    <!-- EMAIL LOGIN SECTION -->
    <!-- ================================= -->

    <div
        id="loginSection"
        class="container"
    >


        <div class="login-icon">
            🎓
        </div>


        <h1 class="login-title">
            Student Leave Tracking System
        </h1>


        <p class="login-text">
            Enter your email address to continue
        </p>


        <form id="loginForm">


            <label for="email">
                Email Address
            </label>


            <input
                type="email"
                id="email"
                placeholder="Enter your email address"
                required
            >


            <button
                type="submit"
                class="login-btn"
            >
                Login
            </button>


        </form>


        <div
            id="loginMessage"
            class="message"
        ></div>


    </div>



    <!-- ================================= -->
    <!-- MAIN LEAVE SYSTEM -->
    <!-- ================================= -->

    <div
        id="mainSection"
        class="container"
        style="display: none;"
    >


        <h1>
            Student Leave Tracking System
        </h1>


        <p class="subtitle">
            Apply for leave and track your leave status
        </p>


        <!-- LOGGED-IN EMAIL -->

        <div
            id="loggedEmail"
            class="logged-email"
        ></div>


        <!-- ================================= -->
        <!-- LEAVE FORM -->
        <!-- ================================= -->

        <form id="leaveForm">


            <label for="studentName">
                Student Name
            </label>


            <input
                type="text"
                id="studentName"
                placeholder="Enter student name"
                required
            >


            <label for="rollNumber">
                Roll Number
            </label>


            <input
                type="text"
                id="rollNumber"
                placeholder="Enter roll number"
                required
            >


            <label for="leaveType">
                Leave Type
            </label>


            <select
                id="leaveType"
                required
            >

                <option value="">
                    Select Leave Type
                </option>

                <option value="Medical">
                    Medical Leave
                </option>

                <option value="Personal">
                    Personal Leave
                </option>

                <option value="Emergency">
                    Emergency Leave
                </option>

                <option value="Other">
                    Other
                </option>

            </select>


            <label for="fromDate">
                From Date
            </label>


            <input
                type="date"
                id="fromDate"
                required
            >


            <label for="toDate">
                To Date
            </label>


            <input
                type="date"
                id="toDate"
                required
            >


            <label for="reason">
                Reason
            </label>


            <textarea
                id="reason"
                placeholder="Enter reason for leave"
                required
            ></textarea>


            <button type="submit">
                Apply for Leave
            </button>


        </form>


        <!-- MESSAGE -->

        <div
            id="message"
            class="message"
        ></div>



        <!-- ================================= -->
        <!-- LEAVE HISTORY -->
        <!-- ================================= -->

        <div class="history">


            <h2>
                Leave History
            </h2>


            <div class="table-container">


                <table>


                    <thead>

                        <tr>

                            <th>
                                Email
                            </th>

                            <th>
                                Name
                            </th>

                            <th>
                                Roll No
                            </th>

                            <th>
                                Type
                            </th>

                            <th>
                                From
                            </th>

                            <th>
                                To
                            </th>

                            <th>
                                Days
                            </th>

                            <th>
                                Status
                            </th>

                        </tr>

                    </thead>


                    <tbody
                        id="leaveTableBody"
                    ></tbody>


                </table>


            </div>


            <!-- ================================= -->
            <!-- ACTION BUTTONS -->
            <!-- ================================= -->

            <div class="button-group">


                <!-- EXCEL -->

                <button
                    type="button"
                    class="excel-btn"
                    onclick="exportToExcel()"
                >
                    📊 Export to Excel
                </button>


                <!-- CLEAR -->

                <button
                    type="button"
                    class="clear-btn"
                    onclick="clearHistory()"
                >
                    🗑 Clear History
                </button>


                <!-- LOGOUT -->

                <button
                    type="button"
                    class="logout-btn"
                    onclick="logout()"
                >
                    🚪 Logout
                </button>


            </div>


        </div>


    </div>



    <!-- ================================= -->
    <!-- JAVASCRIPT -->
    <!-- ================================= -->

    <script>


        /* ================================= */
        /* GET ELEMENTS */
        /* ================================= */

        const loginForm =
            document.getElementById(
                "loginForm"
            );


        const leaveForm =
            document.getElementById(
                "leaveForm"
            );


        const loginSection =
            document.getElementById(
                "loginSection"
            );


        const mainSection =
            document.getElementById(
                "mainSection"
            );


        const loginMessage =
            document.getElementById(
                "loginMessage"
            );


        const message =
            document.getElementById(
                "message"
            );


        const tableBody =
            document.getElementById(
                "leaveTableBody"
            );


        const loggedEmail =
            document.getElementById(
                "loggedEmail"
            );



        /* ================================= */
        /* EMAIL LOGIN */
        /* ================================= */

        loginForm.addEventListener(
            "submit",
            function(event) {

                event.preventDefault();


                const email =
                    document
                        .getElementById("email")
                        .value
                        .trim();


                /* CHECK EMAIL */

                if (!email) {

                    showLoginMessage(
                        "Please enter your email address.",
                        "error"
                    );

                    return;
                }


                /* CHECK @ */

                if (!email.includes("@")) {

                    showLoginMessage(
                        "Please enter a valid email address.",
                        "error"
                    );

                    return;
                }


                /* SAVE EMAIL */

                localStorage.setItem(
                    "studentEmail",
                    email
                );


                /* OPEN FORM */

                openMainSection(email);

            }
        );



        /* ================================= */
        /* OPEN MAIN SECTION */
        /* ================================= */

        function openMainSection(email) {


            loginSection.style.display =
                "none";


            mainSection.style.display =
                "block";


            loggedEmail.textContent =
                "Logged in as: " + email;


            displayLeaves();

        }



        /* ================================= */
        /* CHECK PREVIOUS LOGIN */
        /* ================================= */

        const savedEmail =
            localStorage.getItem(
                "studentEmail"
            );


        if (savedEmail) {

            openMainSection(
                savedEmail
            );

        }



        /* ================================= */
        /* DISPLAY LEAVES */
        /* ================================= */

        function displayLeaves() {


            const leaves =
                JSON.parse(
                    localStorage.getItem(
                        "leaves"
                    )
                ) || [];


            tableBody.innerHTML = "";


            leaves.forEach(
                function(leave) {


                    const row =
                        document.createElement(
                            "tr"
                        );


                    row.innerHTML = `

                        <td>
                            ${leave.email}
                        </td>

                        <td>
                            ${leave.name}
                        </td>

                        <td>
                            ${leave.roll}
                        </td>

                        <td>
                            ${leave.type}
                        </td>

                        <td>
                            ${leave.from}
                        </td>

                        <td>
                            ${leave.to}
                        </td>

                        <td>
                            ${leave.days}
                        </td>

                        <td>

                            <span
                                class="status ${leave.status.toLowerCase()}"
                            >
                                ${leave.status}
                            </span>

                        </td>

                    `;


                    tableBody.appendChild(
                        row
                    );

                }
            );

        }



        /* ================================= */
        /* SUBMIT LEAVE */
        /* ================================= */

        leaveForm.addEventListener(
            "submit",
            function(event) {


                event.preventDefault();


                /* GET VALUES */

                const name =
                    document
                        .getElementById(
                            "studentName"
                        )
                        .value
                        .trim();


                const roll =
                    document
                        .getElementById(
                            "rollNumber"
                        )
                        .value
                        .trim();


                const type =
                    document
                        .getElementById(
                            "leaveType"
                        )
                        .value;


                const from =
                    document
                        .getElementById(
                            "fromDate"
                        )
                        .value;


                const to =
                    document
                        .getElementById(
                            "toDate"
                        )
                        .value;


                const reason =
                    document
                        .getElementById(
                            "reason"
                        )
                        .value
                        .trim();


                /* CHECK DATES */

                if (
                    new Date(to) <
                    new Date(from)
                ) {

                    showMessage(
                        "To Date cannot be earlier than From Date.",
                        "error"
                    );

                    return;
                }


                /* CALCULATE DAYS */

                const startDate =
                    new Date(from);


                const endDate =
                    new Date(to);


                const difference =
                    endDate - startDate;


                const days =
                    Math.ceil(
                        difference /
                        (1000 * 60 * 60 * 24)
                    ) + 1;


                /* GET EMAIL */

                const email =
                    localStorage.getItem(
                        "studentEmail"
                    );


                /* CREATE LEAVE */

                const leave = {

                    email: email,

                    name: name,

                    roll: roll,

                    type: type,

                    from: from,

                    to: to,

                    days: days,

                    reason: reason,

                    status: "Pending"

                };


                /* GET OLD DATA */

                const leaves =
                    JSON.parse(
                        localStorage.getItem(
                            "leaves"
                        )
                    ) || [];


                /* ADD DATA */

                leaves.push(
                    leave
                );


                /* SAVE DATA */

                localStorage.setItem(
                    "leaves",
                    JSON.stringify(
                        leaves
                    )
                );


                /* MESSAGE */

                showMessage(
                    "Leave application submitted successfully!",
                    "success"
                );


                /* RESET FORM */

                leaveForm.reset();


                /* REFRESH TABLE */

                displayLeaves();

            }
        );



        /* ================================= */
        /* SHOW MESSAGE */
        /* ================================= */

        function showMessage(
            text,
            type
        ) {


            message.textContent =
                text;


            message.className =
                "message " + type;


            message.style.display =
                "block";


            setTimeout(
                function() {

                    message.style.display =
                        "none";

                },
                3000
            );

        }



        /* ================================= */
        /* LOGIN MESSAGE */
        /* ================================= */

        function showLoginMessage(
            text,
            type
        ) {


            loginMessage.textContent =
                text;


            loginMessage.className =
                "message " + type;


            loginMessage.style.display =
                "block";

        }



        /* ================================= */
        /* EXPORT TO EXCEL */
        /* ================================= */

        function exportToExcel() {


            /* GET LEAVE DATA */

            const leaves =
                JSON.parse(
                    localStorage.getItem(
                        "leaves"
                    )
                ) || [];


            /* CHECK DATA */

            if (leaves.length === 0) {

                showMessage(
                    "No leave records available to export.",
                    "error"
                );

                return;
            }


            /* CREATE EXCEL DATA */

            const excelData =
                leaves.map(
                    function(
                        leave,
                        index
                    ) {

                        return {

                            "S.No":
                                index + 1,

                            "Email":
                                leave.email,

                            "Student Name":
                                leave.name,

                            "Roll Number":
                                leave.roll,

                            "Leave Type":
                                leave.type,

                            "From Date":
                                leave.from,

                            "To Date":
                                leave.to,

                            "Number of Days":
                                leave.days,

                            "Reason":
                                leave.reason,

                            "Status":
                                leave.status

                        };

                    }
                );


            /* CREATE WORKSHEET */

            const worksheet =
                XLSX.utils.json_to_sheet(
                    excelData
                );


            /* CREATE WORKBOOK */

            const workbook =
                XLSX.utils.book_new();


            /* ADD SHEET */

            XLSX.utils.book_append_sheet(
                workbook,
                worksheet,
                "Leave Records"
            );


            /* DOWNLOAD EXCEL FILE */

            XLSX.writeFile(
                workbook,
                "Student_Leave_Records.xlsx"
            );


            /* SHOW MESSAGE */

            showMessage(
                "Excel file downloaded successfully!",
                "success"
            );

        }



        /* ================================= */
        /* CLEAR HISTORY */
        /* ================================= */

        function clearHistory() {


            localStorage.removeItem(
                "leaves"
            );


            displayLeaves();


            showMessage(
                "Leave history cleared.",
                "success"
            );

        }



        /* ================================= */
        /* LOGOUT */
        /* ================================= */

        function logout() {


            localStorage.removeItem(
                "studentEmail"
            );


            mainSection.style.display =
                "none";


            loginSection.style.display =
                "block";


            document
                .getElementById("email")
                .value = "";


        }

    </script>

</body>

</html>
